<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="manifest" href="manifest.json" />

</head>

<body>
    <div id="app">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#FFF8E7; text-align:center; padding:2rem;">
            <svg width="84" height="84" viewBox="0 0 40 40" fill="none" style="animation: gentle-float 2s infinite ease-in-out;">
                <path d="M7 17L12 4L20 13L7 17Z" fill="#FF9F43" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M10 13L13 7L17 12L10 13Z" fill="#FFF8E7"/>
                <path d="M33 17L28 4L20 13L33 17Z" fill="#FF9F43" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M30 13L27 7L23 12L30 13Z" fill="#FFF8E7"/>
                <circle cx="20" cy="23" r="14" fill="#FF9F43" stroke="#2B2D42" stroke-width="2.5"/>
                <path d="M6 24C9 28 15 32 20 32C25 32 31 28 34 24C31 29 26 36 20 36C14 36 9 29 6 24Z" fill="#FFF8E7"/>
                <circle cx="15" cy="21" r="2.2" fill="#2B2D42"/>
                <circle cx="25" cy="21" r="2.2" fill="#2B2D42"/>
                <circle cx="16" cy="20" r="0.8" fill="#FFFFFF"/>
                <circle cx="26" cy="20" r="0.8" fill="#FFFFFF"/>
                <polygon points="18,25 22,25 20,27.5" fill="#2B2D42"/>
                <path d="M17 29C18.5 30.5 21.5 30.5 23 29" stroke="#2B2D42" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <h1 style="font-family:'Fredoka', cursive, sans-serif; font-size:2.5rem; color:#2B2D42; margin-top:1rem;">
                VOXIE QUEST
            </h1>
            <p style="font-family:'Nunito', sans-serif; font-size:1.2rem; color:#5BC0EB; font-weight:700;">
                Warming up Voxie's magical ears...
            </p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:#EF476F; color:white; padding:0.8rem 1.5rem; text-align:center; font-family:'Nunito', sans-serif; z-index:10000;">
        Oops! Voxie got a little mixed up.
        <a href="." style="color:white; font-weight:bold; text-decoration:underline; margin-left:1rem;">Restart Game</a>
    </div>

    <!-- Thin JavaScript interop bridges for Voice, Audio Analyser, and Storage -->
    <script src="js/voxieInterop.js?v=2.5"></script>
    <script src="js/voice.js?v=2.5"></script>
    <script src="js/voskInterop.js?v=2.5"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- PWA Offline Service Worker: Active in production, auto-cleared on localhost to prevent stale cache -->
    <script>
        if ('serviceWorker' in navigator) {
            var isLocalhost = Boolean(
                window.location.hostname === 'localhost' ||
                window.location.hostname === '[::1]' ||
                window.location.hostname.match(/^127(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}$/)
            );

            if (isLocalhost) {
                // In local development, unregister service workers and purge caches so code changes appear immediately
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    for (var r of registrations) {
                        r.unregister();
                        console.log('[VoxieDev] Unregistered service worker on localhost');
                    }
                });
                if ('caches' in window) {
                    caches.keys().then(function (names) {
                        for (var n of names) {
                            caches.delete(n);
                            console.log('[VoxieDev] Purged cache:', n);
                        }
                    });
                }
            } else {
                // In production (Vercel), register offline service worker
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('service-worker.js?v=2.6')
                        .then(function (reg) {
                            console.log('[VoxiePWA] Service Worker registered with scope:', reg.scope);
                        })
                        .catch(function (err) {
                            console.warn('[VoxiePWA] Service Worker registration failed:', err);
                        });
                });
            }
        }
    </script>
</body>

</html>
