<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VOXIE QUEST - Speak, Play, Learn!</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=2.2" />
    <link rel="stylesheet" href="css/storybook.css?v=2.2" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="VoxieQuest.Web.styles.css?v=2.2" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#FFFDF7; text-align:center; padding:2rem;">
            <div style="font-size:4rem; animation: gentle-float 2s infinite ease-in-out;">🦎 ✨</div>
            <h1 style="font-family:'Fredoka', cursive, sans-serif; font-size:2.5rem; color:#2B2D42; margin-top:1rem;">
                VOXIE QUEST
            </h1>
            <p style="font-family:'Nunito', sans-serif; font-size:1.2rem; color:#4EA8DE; font-weight:700;">
                Warming up Voxie's magical ears...
            </p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:#EF476F; color:white; padding:0.8rem 1.5rem; text-align:center; font-family:'Nunito', sans-serif; z-index:10000;">
        Oops! Voxie got a little mixed up.
        <a href="." style="color:white; font-weight:bold; text-decoration:underline; margin-left:1rem;">Restart Game</a>
    </div>

    <!-- Thin JavaScript interop bridges for Voice, Audio Analyser, and Storage -->
    <script src="js/voxieInterop.js?v=2.2"></script>
    <script src="js/voice.js?v=2.2"></script>
    <script src="js/voskInterop.js?v=2.2"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
